name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Lint + test (${{ matrix.edition }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: windows-powershell-5.1
            exe: powershell.exe
          - edition: powershell-7
            exe: pwsh.exe
    steps:
      - uses: actions/checkout@v4

      # `shell:` cannot use the matrix context, so the edition is chosen on the command line instead.
      - name: Build
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File build\build.ps1 -Task "Lint,Test" -CI

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.edition }}
          path: testResults.xml

  package:
    name: Package
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Package
        shell: pwsh
        run: ./build/build.ps1 -Task Package
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
